name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_GOOGLE_ANALYTICS_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_ANALYTICS_ID }}
      NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${{ vars.NEXT_PUBLIC_UMAMI_WEBSITE_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify deployment configuration
        run: npm test

      - name: Build static site
        run: npm run build

      - name: Verify static output
        run: |
          test -f out/zh/index.html
          test -f out/_redirects

      - name: Ensure Cloudflare Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_PAGES_PROJECT_NAME"

          # Idempotent: attempt to create the project; treat "already exists"
          # (code 8000002) as success rather than parsing `pages project list`,
          # which is unreliable across wrangler versions and output shapes.
          create_output="$(npx wrangler pages project create "$CLOUDFLARE_PAGES_PROJECT_NAME" --production-branch=main 2>&1 || true)"
          echo "$create_output"
          if echo "$create_output" | grep -q "A project with this name already exists"; then
            echo "Cloudflare Pages project already exists: $CLOUDFLARE_PAGES_PROJECT_NAME"
          elif echo "$create_output" | grep -qE "(Successfully created|Creating.*project)"; then
            echo "Created Cloudflare Pages project: $CLOUDFLARE_PAGES_PROJECT_NAME"
          else
            echo "Error: failed to ensure Cloudflare Pages project exists" >&2
            exit 1
          fi

      - name: Configure Pages runtime secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
          UNSPLASH_API_KEY: ${{ secrets.UNSPLASH_API_KEY }}
        run: |
          test -n "$UNSPLASH_API_KEY"
          printf '%s' "$UNSPLASH_API_KEY" | npx wrangler pages secret put UNSPLASH_API_KEY --project-name="$CLOUDFLARE_PAGES_PROJECT_NAME"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }} --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
